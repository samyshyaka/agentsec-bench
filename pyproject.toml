[project]
name = "agentsec-bench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kelvin Oteyo", email = "oteyikelvin@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "agentguard",
    "agentsec-crosswalk",
    "agentsec-scorecard",
    "agenttrace",
    "anthropic>=1.5.0",
    "openai>=3.14.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
agentsec-bench = "agentsec_bench:main"


[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
agentguard = { path = "../agentguard", editable = true }
agenttrace = { path = "../AgentTrace", editable = true }
agentsec-scorecard = { path = "../agentsec-scorecard", editable = true }
agentsec-crosswalk = { path = "../agentsec-crosswalk", editable = true }

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
